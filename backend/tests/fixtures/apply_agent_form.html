<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobGraph Apply Agent Fixture</title>
  </head>
  <body>
    <main>
      <h1>Demo Application</h1>
      <form>
        <label for="name">Full legal name</label>
        <input id="name" name="name" required />

        <label for="email">Email address</label>
        <input id="email" name="email" required />

        <label for="phone">Mobile phone</label>
        <input id="phone" name="phone" />

        <label for="school">University or college</label>
        <input id="school" name="school" />

        <label for="resume">Resume</label>
        <input id="resume" name="resume" type="file" required />

        <label for="custom">Why are you interested?</label>
        <textarea id="custom" name="custom" required></textarea>

        <button type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
