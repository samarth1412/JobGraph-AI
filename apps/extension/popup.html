<!doctype html>
<html>
  <body style="font-family:Arial,sans-serif;padding:14px;width:310px">
    <h3 style="margin:0 0 12px">JobGraph AI Autofill</h3>
    <label>API URL</label>
    <input id="api" value="http://127.0.0.1:8022" style="width:100%;margin:4px 0 10px;padding:8px">
    <label>Candidate ID</label>
    <input id="candidate" value="default" style="width:100%;margin:4px 0 12px;padding:8px">
    <button id="fill" style="width:100%;padding:10px;border:0;border-radius:8px;background:#00de8a;font-weight:700">
      Fill current application
    </button>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px">
      <input id="auto" type="checkbox">
      Auto-fill application pages after Apply with agent
    </label>
    <p id="status" style="font-size:13px;line-height:1.35"></p>
    <script src="popup.js"></script>
  </body>
</html>
