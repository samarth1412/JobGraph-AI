services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobgraph
      POSTGRES_USER: jobgraph
      POSTGRES_PASSWORD: jobgraph
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "8020:8020"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://jobgraph:jobgraph@db:5432/jobgraph
    depends_on:
      - db

  web:
    image: node:22-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8020
    ports:
      - "3020:3020"
    depends_on:
      - api

volumes:
  pgdata:
